name: iOS app (App Store)

# Every push that touches the app builds it for the iPhone/iPad simulator (no Apple account needed),
# so a broken build shows up straight away. Run it by hand (Actions → iOS app → Run workflow) to
# archive, sign and upload a build to App Store Connect / TestFlight, once the Apple secrets are set.
on:
  push:
    paths: ["app/**", "data/**", "ios/**", "scripts/build.py", "package*.json", "capacitor.config.json", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store, e.g. 1.0.0"
        default: "1.0.0"
        required: true

jobs:
  ios:
    runs-on: macos-26
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_APPLE: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build the app bundle and copy it into the iOS project
        run: |
          npm ci
          npm run build:native
          npx cap sync ios

      - name: Build for the simulator (checks the project compiles)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30

      - name: Archive, sign and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && env.HAS_APPLE == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Vocabursters.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -n 30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Vocabursters.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export "${AUTH[@]}"
          rm -f "$KEY_PATH"
