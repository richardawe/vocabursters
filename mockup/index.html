<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocabursters">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vocabursters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Weekly spelling games for Year 1 to Year 6.">
<meta name="theme-color" content="#E6F3EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: one centred play column (max 760px). Chunky ink-outlined "sticker" controls on a pale sea-glass ground; the sunflower burst colour marks the one main action per screen. */
:root {
  --ground: #E6F3EF;
  --surface: #FFFFFF;
  --surface-2: #F1F8F5;
  --ink: #17304A;
  --ink-soft: #4A6274;
  --line: #C6DED6;
  --sun: #FFC53D;
  --sun-soft: #FFF0C7;
  --on-sun: #2B1E00;
  --coral: #D9472A;
  --coral-soft: #FDE3DC;
  --leaf: #157F44;
  --leaf-soft: #D3F0DF;
  --sky: #1F6FBA;
  --sky-soft: #DCEBFA;
  --bubble: #CDEBFF;
  --bubble-edge: #7FC1EE;
  --mark: #FFE08A;
  --font-display: "Grandstander", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-word: var(--font-body);
  --text-scale: 1;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1C22; --surface: #14303A; --surface-2: #1A3A46; --ink: #EAF5F2; --ink-soft: #A6C1C7; --line: #2B4E5A;
    --sun: #FFCB4D; --sun-soft: #4A3C12; --on-sun: #2B1E00; --coral: #FF8466; --coral-soft: #4A2A22; --leaf: #4FD08A; --leaf-soft: #17432D;
    --sky: #7DBDF8; --sky-soft: #1C3A55; --bubble: #21506A; --bubble-edge: #4C8CB5; --mark: #6B5617; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1C22; --surface: #14303A; --surface-2: #1A3A46; --ink: #EAF5F2; --ink-soft: #A6C1C7; --line: #2B4E5A;
  --sun: #FFCB4D; --sun-soft: #4A3C12; --on-sun: #2B1E00; --coral: #FF8466; --coral-soft: #4A2A22; --leaf: #4FD08A; --leaf-soft: #17432D;
  --sky: #7DBDF8; --sky-soft: #1C3A55; --bubble: #21506A; --bubble-edge: #4C8CB5; --mark: #6B5617; color-scheme: dark;
}
html { font-size: calc(100% * var(--text-scale)); }
html, body { min-height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 1.05rem; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; font-weight: 800; }
h1 { font-size: 2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0; }
:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; border-radius: 10px; }

.shell { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; display: grid; gap: 18px; }
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar .who { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 4px; min-height: 52px; cursor: pointer; }
.topbar .who .av { font-size: 1.7rem; width: 42px; height: 42px; display: grid; place-items: center; background: var(--sun-soft); border-radius: 50%; }
.topbar .who b { font-family: var(--font-display); font-size: 1.1rem; }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.star { border-color: var(--sun); }
.star-glyph { color: var(--sun); -webkit-text-stroke: 1px var(--on-sun); paint-order: stroke; }
.icon-btn { min-width: 52px; min-height: 52px; border-radius: 16px; border: 2px solid var(--ink); background: var(--surface); box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: inline-grid; place-items: center; font-size: 1.3rem; font-weight: 700; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.btn { min-height: 58px; padding: 0 24px; border-radius: 18px; border: 2px solid var(--ink); background: var(--surface); box-shadow: 0 5px 0 var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn.good { background: var(--leaf-soft); }
.btn.small { min-height: 46px; font-size: 1rem; padding: 0 16px; border-radius: 14px; box-shadow: 0 3px 0 var(--ink); }
.btn.plain { border-color: var(--line); box-shadow: none; font-family: var(--font-body); font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.stack { display: grid; gap: 14px; }
.muted { color: var(--ink-soft); }
.small-text { font-size: .9rem; }
.panel { background: var(--surface); border-radius: var(--r); padding: 18px; border: 2px solid var(--line); display: grid; gap: 14px; min-width: 0; }
.speak { border: 0; background: var(--sky-soft); color: var(--sky); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: inline-grid; place-items: center; flex: none; }
.speak svg { width: 22px; height: 22px; }
.heading-row { display: flex; gap: 10px; align-items: center; }
.eyebrow { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; color: var(--ink-soft); }

/* Profiles */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.player { background: var(--surface); border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink); border-radius: 22px; padding: 18px 12px; display: grid; gap: 6px; justify-items: center; cursor: pointer; position: relative; }
.player:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.player .av { font-size: 3rem; width: 84px; height: 84px; border-radius: 50%; background: var(--sun-soft); display: grid; place-items: center; }
.player b { font-family: var(--font-display); font-size: 1.3rem; }
.player.add { border-style: dashed; box-shadow: none; background: transparent; }
.tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); }
.brand { display: grid; gap: 6px; padding-top: 12px; }
.brand h1 { font-size: clamp(2.2rem, 8vw, 3.2rem); letter-spacing: -.01em; }
.brand h1 span { color: var(--coral); }

/* Map */
.yearhead { display: grid; gap: 8px; }
.goal { display: flex; gap: 14px; align-items: center; }
.ring { width: 64px; height: 64px; flex: none; }
.trail { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 8px; }
@media (max-width: 520px) { .trail { grid-template-columns: repeat(4, 1fr); } }
.stop { display: grid; justify-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 4px 0; }
.stop .dot { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; background: var(--surface); font-variant-numeric: tabular-nums; }
.stop.done .dot { background: var(--leaf-soft); border-color: var(--leaf); }
.stop.now .dot { background: var(--sun); color: var(--on-sun); box-shadow: 0 0 0 6px var(--sun-soft); }
.stop.locked { cursor: default; }
.stop.locked .dot { border-style: dashed; border-color: var(--line); color: var(--ink-soft); background: transparent; }
.stop .mini { font-size: .8rem; min-height: 1.2em; font-variant-numeric: tabular-nums; }
.now-badge { font-size: .7rem; font-weight: 700; background: var(--ink); color: var(--ground); padding: 1px 8px; border-radius: 999px; }
@media (prefers-reduced-motion: no-preference) { .calm-off .stop.now .dot { animation: pulse 2s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px var(--sun-soft); } }

/* Week hub */
.focus-card { background: var(--sun-soft); border: 2px solid var(--sun); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.focus-card .pattern { font-family: var(--font-word); font-size: 1.6rem; font-weight: 700; }
.wordchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-family: var(--font-word); font-size: 1.15rem; font-weight: 700; cursor: pointer; min-height: 44px; }
.wchip svg { width: 18px; height: 18px; color: var(--sky); }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.act { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 14px; border-radius: 20px; border: 2px solid var(--ink); background: var(--surface); box-shadow: 0 5px 0 var(--ink); cursor: pointer; min-height: 96px; }
.act:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.act .glyph { grid-row: span 3; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-word); font-weight: 700; font-size: 1.15rem; border: 2px solid var(--ink); }
.act b { font-family: var(--font-display); font-size: 1.12rem; }
.act .blurb { font-size: .9rem; color: var(--ink-soft); line-height: 1.3; }
.act .stars { font-size: 1rem; letter-spacing: 2px; }
.act.test { border-width: 3px; }
.g-learn { background: var(--sky-soft); } .g-burst { background: var(--bubble); } .g-missing { background: var(--sun-soft); }
.g-spot { background: var(--leaf-soft); } .g-scramble { background: var(--coral-soft); } .g-homophone { background: var(--sun-soft); } .g-test { background: var(--sun); color: var(--on-sun); }
.stars .off { color: var(--line); -webkit-text-stroke: 0; }

/* Play */
.playhead { display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 16px; background: var(--surface); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .3s; }
.stage { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 20px 16px; display: grid; gap: 18px; justify-items: center; text-align: center; min-width: 0; }
.prompt { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bigword { font-family: var(--font-word); font-size: clamp(2.2rem, 10vw, 3.6rem); font-weight: 700; letter-spacing: .04em; line-height: 1.1; overflow-wrap: anywhere; }
.bigword mark { background: var(--mark); color: inherit; border-radius: 8px; padding: 0 .06em; }
.sentence { font-size: 1.2rem; max-width: 34ch; }
.sentence .gap { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--ink); }
.cover { width: min(100%, 360px); height: 88px; border-radius: 18px; background: repeating-linear-gradient(45deg, var(--sky-soft) 0 14px, var(--surface-2) 14px 28px); border: 2px dashed var(--sky); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--sky); font-size: 1.2rem; }
.typed { min-height: 72px; width: min(100%, 520px); border: 3px solid var(--ink); border-radius: 16px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-family: var(--font-word); font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 700; letter-spacing: .05em; padding: 4px 10px; overflow-wrap: anywhere; }
.typed .caret { width: 3px; height: 1.1em; background: var(--ink); margin-left: 3px; }
@media (prefers-reduced-motion: no-preference) { .calm-off .typed .caret { animation: blink 1s steps(1) infinite; } }
@keyframes blink { 50% { opacity: 0; } }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.slot { width: 2.3rem; height: 2.9rem; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-word); font-size: 1.6rem; font-weight: 700; }
.slot.filled { background: var(--leaf-soft); border-color: var(--leaf); }
.slot.bad { background: var(--coral-soft); border-color: var(--coral); }
button.slot { cursor: pointer; }
.gapword { font-family: var(--font-word); font-size: clamp(2rem, 9vw, 3.2rem); font-weight: 700; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; letter-spacing: .03em; }
.gapbox { min-width: 1.6em; padding: 0 .2em; height: 1.35em; border: 3px dashed var(--ink); border-radius: 12px; display: inline-grid; place-items: center; background: var(--sun-soft); }
.gapbox.right { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(100%, 520px); }
.opt { min-height: 72px; border-radius: 18px; border: 2px solid var(--ink); background: var(--surface); box-shadow: 0 5px 0 var(--ink); font-family: var(--font-word); font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 700; cursor: pointer; padding: 6px 10px; overflow-wrap: anywhere; }
.opt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.opt.right { background: var(--leaf-soft); border-color: var(--leaf); box-shadow: 0 5px 0 var(--leaf); }
.opt.wrong { background: var(--coral-soft); border-color: var(--coral); box-shadow: none; opacity: .7; text-decoration: line-through; }
.feedback { min-height: 1.6em; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
.feedback.good { color: var(--leaf); } .feedback.try { color: var(--coral); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { width: 3rem; height: 3.4rem; border-radius: 12px; border: 2px solid var(--ink); background: var(--sun-soft); box-shadow: 0 4px 0 var(--ink); font-family: var(--font-word); font-size: 1.7rem; font-weight: 700; cursor: pointer; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tile.used { visibility: hidden; }

/* Bubble Burst */
.burst-area { position: relative; width: 100%; border-radius: 20px; background: radial-gradient(circle at 30% 20%, var(--surface-2), var(--sky-soft)); overflow: hidden; }
.bubble { position: absolute; transform: translate(-50%, -50%); width: var(--bs, 66px); height: var(--bs, 66px); border-radius: 50%; border: 2px solid var(--bubble-edge); background: radial-gradient(circle at 32% 28%, var(--surface) 0 12%, var(--bubble) 40%); font-family: var(--font-word); font-weight: 700; font-size: calc(var(--bs, 66px) * .48); cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: transform .2s, opacity .2s; }
@media (prefers-reduced-motion: no-preference) { .calm-off .bubble { animation: bob 3.2s ease-in-out infinite; } }
@keyframes bob { 50% { margin-top: -10px; } }
.bubble.pop { transform: translate(-50%, -50%) scale(1.6); opacity: 0; pointer-events: none; }
.bubble.hint { box-shadow: 0 0 0 6px var(--sun); }
.wobble { animation: wobble .4s; }
@keyframes wobble { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }

/* Keyboard */
.kb { width: min(100%, 620px); display: grid; gap: 7px; user-select: none; -webkit-user-select: none; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1 1 0; max-width: 54px; min-width: 0; height: 52px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); box-shadow: 0 3px 0 var(--ink); font-family: var(--font-word); font-size: 1.35rem; font-weight: 700; cursor: pointer; padding: 0; touch-action: manipulation; }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.key.wide { max-width: 110px; flex: 1.8 1 0; font-size: 1rem; font-family: var(--font-display); }
.key.on { background: var(--sun); color: var(--on-sun); }

/* Results */
.bigstars { font-size: 4rem; letter-spacing: 8px; line-height: 1; }
@media (prefers-reduced-motion: no-preference) { .calm-off .bigstars .star-glyph { display: inline-block; animation: popin .5s backwards; } .calm-off .bigstars .star-glyph:nth-child(2) { animation-delay: .25s } .calm-off .bigstars .star-glyph:nth-child(3) { animation-delay: .5s } }
@keyframes popin { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } }
.check-list { display: grid; gap: 8px; width: 100%; text-align: left; }
.check-item { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.check-item .mk { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
.check-item.ok .mk { background: var(--leaf-soft); color: var(--leaf); }
.check-item.no .mk { background: var(--coral-soft); color: var(--coral); }
.check-item .w { font-family: var(--font-word); font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere; }
.d-bad { color: var(--coral); text-decoration: underline wavy; text-underline-offset: 4px; }
.d-need { background: var(--mark); border-radius: 4px; }
.sticker-won { font-size: 3.4rem; width: 96px; height: 96px; border-radius: 50%; background: var(--sun-soft); border: 3px dashed var(--sun); display: grid; place-items: center; }

/* Pet */
.pet-wrap { display: grid; justify-items: center; gap: 8px; text-align: center; }
.pet { width: 200px; height: 200px; }
.pet-mini { width: 40px; height: 40px; }
.meter { width: min(100%, 360px); height: 18px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--ink); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--sun); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.swatch { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--ink); cursor: pointer; }
.swatch.sel { box-shadow: 0 0 0 4px var(--ink); }
.swatch[disabled] { opacity: .3; cursor: not-allowed; }
.stickerbook { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (max-width: 520px) { .stickerbook { grid-template-columns: repeat(4, 1fr); } }
.sticker { aspect-ratio: 1; max-width: 100%; border-radius: 16px; display: grid; place-items: center; font-size: 1.9rem; background: var(--surface-2); border: 2px dashed var(--line); position: relative; }
.sticker.got { background: var(--sun-soft); border: 2px solid var(--sun); }
.sticker small { position: absolute; bottom: 2px; right: 6px; font-size: .65rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Forms / parent */
.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 700; }
.input { min-height: 52px; border-radius: 14px; border: 2px solid var(--ink); background: var(--surface); padding: 0 14px; font-size: 1.15rem; width: 100%; }
textarea.input { padding: 10px 14px; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice button { min-height: 50px; min-width: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.choice button[aria-pressed="true"] { border-color: var(--ink); background: var(--sun); color: var(--on-sun); }
.avatars button { font-size: 1.8rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { flex: none; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switch { width: 64px; height: 36px; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface-2); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); transition: left .15s; }

/* ---------- rounds ---------- */
function startRound(act, { y, w, words, bounce, smart } = {}) {
  const p = me();
  y = y || p.year; w = w || p.week;
  const wk = weekData(y, w);
  let list = words ? [...words] : [...wk.words];
  if (act === "homophone") list = homophoneWords(list);
  if (act === "test" && !bounce && !smart) list = [...list, ...p.review.filter(x => !list.includes(x)).slice(0, 3)];
  list = uniq(list);
  if (!list.length) { toast("No words to practise here yet."); return; }
  if (act !== "learn") list = shuffle(list);
  const acts = smart ? list.map((_, i) => ["spot", "missing", "scramble"][i % 3]) : null;
  const free = !!(bounce || smart);
  go("play", { act: smart ? "smart" : act, acts, y, w, bounce: !!bounce, smart: !!smart, free, focus: free ? null : wk.focus, words: list, i: 0, firstTry: [], tries: 0, answers: [], phase: "look", typed: "", t0: Date.now() });
}
const startSmart = words => startRound("spot", { words: words || smartWords(me()), smart: true });
const curAct = () => R.acts ? R.acts[R.i] : R.act;
function playHead() {
  const a = ACTS.find(x => x.id === curAct());
  const pct = Math.round(R.i / R.words.length * 100);
  const label = R.bounce ? "Bounce-back words" : R.smart ? "Smart practice · " + a.name : a.name + " · Week " + R.w;
  return `<div class="playhead"><button class="icon-btn" id="quit" aria-label="Stop playing">✕</button><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="chip">${Math.min(R.i + 1, R.words.length)}/${R.words.length}</span></div>
  <p class="eyebrow" style="text-align:center">${esc(label)}</p>`;
}
function afterPlayCommon() {

}
function markWord(word, ok) {
  const p = me(), s = p.words[word] || (p.words[word] = { r: 0, x: 0, box: 1 });
  if (ok) s.r++; else s.x++;
  s.last = Date.now();
}
function nextWord(ok) {
  R.firstTry[R.i] = R.tries === 0 && ok;
  markWord(R.words[R.i], R.tries === 0 && ok);
  R.i++; R.tries = 0; R.phase = "look"; R.typed = "";
  if (R.i >= R.words.length) return finishRound();
  render();
}
function finishRound() {
  const p = me();
  const correct = R.act === "test" ? R.answers.filter(a => a.ok).length : R.firstTry.filter(Boolean).length;
  const total = R.words.length, acc = correct / total;
  const stars = acc >= .9 ? 3 : acc >= .6 ? 2 : 1;
  const key = R.y + "-" + R.w;
  let gained = 0;
  if (!R.free) { const st = p.stars[key] || (p.stars[key] = {}); gained = Math.max(0, stars - (st[R.act] || 0)); st[R.act] = Math.max(st[R.act] || 0, stars); }
  else { const st = p.stars.extra || (p.stars.extra = { n: 0 }); st.n++; gained = 1; }
  if (p.goal.key !== weekKey()) p.goal = { key: weekKey(), done: 0 };
  p.goal.done++;
  let sticker = null, unlocked = false;
  if (R.act === "test") {
    const missed = R.answers.filter(a => !a.ok).map(a => a.word);
    R.answers.forEach(a => { const s = p.words[a.word]; if (s) s.box = a.ok ? Math.min(5, (s.box || 1) + 1) : 1; });
    p.review = uniq([...p.review.filter(w => !R.answers.some(a => a.ok && a.word === w)), ...missed]);
    if (!R.free) {
      p.tests.push({ y: R.y, w: R.w, score: correct, total, missed, date: Date.now() });
      sticker = stickerFor(R.y, R.w);
      if (R.y === p.year && R.w === p.week && p.week < 36) { p.week++; unlocked = true; }
    }
  }
  const coins = correct + (R.act === "test" && !R.free ? 5 : 0);
  earn(p, coins);
  save();
  go("results", { act: R.act, y: R.y, w: R.w, bounce: R.bounce, smart: R.smart, free: R.free, correct, total, stars, gained, coins, answers: R.answers, sticker, unlocked });
}

function keyboardHTML(words) {

  const all = words.join("");
  const extra = [];
  if (p.year >= 2 || all.includes("'")) extra.push("'");

  </div>`;
}
function bindKeyboard(onChange, onEnter) {
  KB = { shift: KB ? KB.shift : false, onChange, onEnter };

}
function handleKey(k) {
  if (!KB) return;
  if (k === "SHIFT") { KB.shift = !KB.shift; $$(".key[data-key]").forEach(b => { const v = b.dataset.key; if (v.length === 1) b.textContent = KB.shift ? v.toUpperCase() : v; }); $('.key[data-key="SHIFT"]').classList.toggle("on", KB.shift); return; }
  if (k === "ENTER") { KB.onEnter && KB.onEnter(); return; }
  if (k === "BACK") R.typed = R.typed.slice(0, -1);
  else { if (R.typed.length >= 24) return; R.typed += KB.shift ? k.toUpperCase() : k; if (KB.shift) handleKey("SHIFT"); }
  sfx.tap(); KB.onChange();
}
document.addEventListener("keydown", e => {
  if (!KB || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (e.key === "Backspace") { e.preventDefault(); handleKey("BACK"); }

  else if (/^[a-zA-Zé'’-]$/.test(e.key)) { e.preventDefault(); const k = e.key === "’" ? "'" : e.key; if (k !== k.toLowerCase()) { R.typed += k; sfx.tap(); KB.onChange(); } else handleKey(k); }
});
const typedHTML = () => `<div class="typed" id="typed" aria-label="Your spelling">${esc(R.typed)}<span class="caret"></span></div>`;
const refreshTyped = () => { $("#typed").innerHTML = esc(R.typed) + '<span class="caret"></span>'; const b = $("#submit"); if (b) b.disabled = !R.typed; };

  return { ok: false };

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i].toLowerCase() === b[j].toLowerCase() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);

  return {
    attempt: [...a].map((c, k) => okA[k] ? esc(c) : `<span class="d-bad">${esc(c)}</span>`).join("") || "<span class='muted'>(blank)</span>",

  };
}

};

PLAY.missing = {

PLAY.spot = {

PLAY.scramble = {
  html: w => {
    if (!R.j || R.j.word !== w) {
      const chars = [...w]; let order;
      do { order = shuffle(chars.map((_, i) => i)); } while (chars.length > 1 && order.map(i => chars[i]).join("") === w);
      R.j = { word: w, tiles: order.map(i => ({ ch: chars[i], used: false })), placed: [], bad: [] };
    }
    const j = R.j;
    return `<section class="stage">
      <p class="prompt">Put the letters in order ${speakBtn(w)}</p>
      <div class="slots">${[...w].map((_, i) => j.placed[i] !== undefined ? `<button class="slot filled ${j.bad.includes(i) ? "bad" : ""}" data-slot="${i}" aria-label="Remove ${esc(j.tiles[j.placed[i]].ch)}">${esc(j.tiles[j.placed[i]].ch)}</button>` : `<span class="slot"></span>`).join("")}</div>
      <div class="tiles">${j.tiles.map((t, i) => `<button class="tile ${t.used ? "used" : ""}" data-tile="${i}" ${t.used ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(t.ch)}</button>`).join("")}</div>
      <p class="feedback" id="fb"></p></section>`;
  },
  bind: w => {
    if (!R.j.spoke) { R.j.spoke = true; sayWord(w, false); }
    const j = R.j;
    $$("[data-tile]").forEach(b => b.onclick = () => {
      const i = +b.dataset.tile; if (j.tiles[i].used || j.done) return;
      const pos = [...w].findIndex((_, k) => j.placed[k] === undefined); if (pos < 0) return;
      j.tiles[i].used = true; j.placed[pos] = i; j.bad = []; sfx.tap();
      if (j.placed.filter(x => x !== undefined).length === w.length) {
        const made = [...w].map((_, k) => j.tiles[j.placed[k]].ch).join("");
        if (made === w) { j.done = true; sfx.good(); render(); $("#fb").className = "feedback good"; $("#fb").textContent = "Unjumbled!"; say(w); later(() => { R.j = null; nextWord(true); }, 1100); return; }
        R.tries++; sfx.oops();
        j.bad = [...w].map((c, k) => j.tiles[j.placed[k]].ch === c ? -1 : k).filter(k => k >= 0);
        render(); $("#fb").className = "feedback try"; $("#fb").textContent = "Almost! Tap the red letters to swap them.";
        return;
      }
      render();
    });
    $$("[data-slot]").forEach(b => b.onclick = () => { if (j.done) return; const k = +b.dataset.slot, t = j.placed[k]; j.tiles[t].used = false; delete j.placed[k]; j.bad = j.bad.filter(x => x !== k); render(); });
  }
};

PLAY.test = {

AFTER.results = () => {

function confetti() {

/* ---------- timed games: Speed round + Bubble Battle ---------- */
const RIVALS = [
  { name: "Fizz", color: "coral", wear: { hat: "party" } }, { name: "Pip", color: "sky", wear: { eyes: "specs" } }, { name: "Zoom", color: "grape", wear: { hat: "wizard" } },
  { name: "Dot", color: "leaf", wear: { neck: "bowtie" } }, { name: "Bo", color: "sun", wear: { eyes: "shades" } }, { name: "Nova", color: "sky", wear: { hat: "bobble" } }
];
function startRush(mode) {
  const p = me();
  if (!S.settings.timed) { toast("Timed games are switched off in the Grown-ups area."); return; }
  const base = Math.max(1.6, p.speed.best || ({ 1: 7, 2: 6, 3: 5, 4: 4.6, 5: 4.3, 6: 4 })[p.year]);
  const bots = mode === "battle" ? shuffle(RIVALS).slice(0, 3).map(b => ({ ...b, score: 0, rate: base * (0.75 + Math.random() * 0.6), acc: 0.82 + Math.random() * 0.13, next: 0 })) : [];
  go("rush", { mode, phase: "ready", bots, pool: shuffle(poolWords(p)), qi: 0, correct: 0, wrong: 0, q: null, dur: 60000 });
}
function rushQuestion() {
  const w = R.pool[R.qi % R.pool.length]; R.qi++;
  R.q = { word: w, opts: shuffle([w, ...misspellings(w, 2, [])]), locked: false };
}
function lanesHTML() {
  const p = me(), all = [{ name: "You", score: R.correct, you: true, color: p.pet, wear: p.wear }, ...R.bots];
  const max = Math.max(12, ...all.map(x => x.score));
  return `<div class="race" aria-label="Race">${all.map((x, i) => `<div class="lane ${x.you ? "you" : ""}">${petSVG(2, x.color, "pet-lane", x.wear)}<div class="track"><i class="fill" data-lane="${i}" style="width:${x.score / max * 100}%"></i><span class="nm">${esc(x.name)}</span></div><b class="sc" data-lsc="${i}">${x.score}</b></div>`).join("")}</div>`;
}
function updateLanes() {
  const all = [R.correct, ...R.bots.map(b => b.score)], max = Math.max(12, ...all);
  all.forEach((n, i) => { const f = $(`[data-lane="${i}"]`); if (f) f.style.width = n / max * 100 + "%"; const t = $(`[data-lsc="${i}"]`); if (t) t.textContent = n; });
}
function rushTick() {
  if (R.screen !== "rush" || R.phase !== "go") return stopTimer();
  const now = performance.now(), left = Math.max(0, R.dur - (now - R.t0));
  R.bots.forEach(b => { while (now >= b.next) { if (Math.random() < b.acc) b.score++; b.next += b.rate * 1000 * (0.6 + Math.random() * 0.8); } });
  const bar = $("#tbar"); if (bar) { bar.style.width = left / R.dur * 100 + "%"; bar.classList.toggle("low", left < 10000); }
  const tt = $("#ttext"); if (tt) tt.textContent = Math.ceil(left / 1000) + "s";
  if (R.mode === "battle") updateLanes();
  if (left <= 0) finishRush();
}
function finishRush() {
  stopTimer();
  const p = me(), n = R.correct;
  R.phase = "done";
  let coins = n;
  if (R.mode === "speed") {
    if (n >= 5) {
      const avg = +(R.dur / 1000 / n).toFixed(2);
      p.speed.runs = [...p.speed.runs, { date: Date.now(), n, avg }].slice(-20);
      if (!p.speed.best || avg < p.speed.best) { p.speed.best = avg; R.newBest = true; coins += 5; }
    }
    const si = statusOf(p);
    if (si !== null && si > p.speed.top) { for (let k = p.speed.top + 1; k <= si; k++) p.speed.reached[k] = Date.now(); p.speed.top = si; R.levelUp = si; coins += 10; }
  } else {
    R.place = 1 + R.bots.filter(b => b.score > n).length;
    coins += [10, 6, 3, 1][R.place - 1];
    p.battles.played++; if (R.place === 1) p.battles.won++;
  }
  R.coins = coins; earn(p, coins);
  if (p.goal.key !== weekKey()) p.goal = { key: weekKey(), done: 0 };
  p.goal.done++;
  save(); render();
  if (R.levelUp != null || R.place === 1 || R.newBest) { sfx.win(); confetti(); }
}
const certificateHTML = (p, si) => `<div class="cert"><p class="eyebrow">Certificate</p><h2>${esc(p.name)}</h2><p>is now a</p><p class="cert-status">${STATUSES[si].name}</p><p class="muted small-text">Vocabursters speller status · ${new Date(p.speed.reached[si] || Date.now()).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</p></div>`;
SCREENS.rush = () => {

      : `<p class="eyebrow">Bubble Battle</p><h1>Race the rivals!</h1><div class="rivals">${R.bots.map(b => `<div class="rival">${petSVG(2, b.color, "pet-rival", b.wear)}<b>${b.name}</b></div>`).join("")}</div><p class="sentence">60 seconds. Every right spelling moves you forward. Can you beat ${R.bots.map(b => b.name).join(", ").replace(/, ([^,]*)$/, " and $1")}?</p>`}

    ${speed ? `<div class="row center"><span class="chip">✓ ${R.correct} right</span>${statusBadge(p)}</div>` : lanesHTML()}

      <div class="options three">${q.opts.map(o => `<button class="opt" data-ro="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    </section>`;

AFTER.rush = () => {
  const back = () => go(R.mode === "speed" ? "practise" : "battle");
  if (R.phase === "ready") {
    $("#rback").onclick = back;
    $("#rstart").onclick = () => {
      R.phase = "count"; R.count = 3; render(); sfx.tap();
      const r = R;
      TIMER = setInterval(() => {
        if (R !== r) return stopTimer();
        R.count--;
        if (R.count > 0) { render(); sfx.tap(); return; }
        stopTimer(); R.phase = "go"; R.t0 = performance.now();
        R.bots.forEach(b => b.next = R.t0 + b.rate * 1000 * (0.6 + Math.random() * 0.8));
        rushQuestion(); render(); sfx.good();
        TIMER = setInterval(rushTick, 100);
      }, 800);
    };
    return;
  }
  if (R.phase === "done") { $("#ragain").onclick = () => startRush(R.mode); $("#rdone").onclick = back; return; }
  if (R.phase !== "go") return;
  $("#quit").onclick = back;
  $$("[data-ro]").forEach(b => b.onclick = () => {
    if (R.q.locked || R.phase !== "go") return;
    const ok = b.dataset.ro === R.q.word;
    markWord(R.q.word, ok);
    if (ok) { R.correct++; sfx.pop(); rushQuestion(); render(); return; }
    R.wrong++; R.q.locked = true; sfx.oops(); b.classList.add("wrong");
    const right = $$("[data-ro]").find(x => x.dataset.ro === R.q.word); if (right) right.classList.add("right");
    later(() => { if (R.phase !== "go") return; rushQuestion(); render(); }, 650);
  });
};

  const legend = `<div class="legend">${[3, 2, 1, 0].map(l => `<span><i class="hc h${l}" aria-hidden="true"></i>${HEAT_NAMES[l]} <b>${counts[l]}</b></span>`).join("")}</div>`;
  return { legend, grid: `<div class="heat">${rows}</div>` };
}
function bindHeat() {
  $$("[data-hw]").forEach(b => b.onclick = () => {

}

  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<form class="modal" role="dialog" aria-modal="true" aria-labelledby="gt"><h2 id="gt">Grown-ups only</h2><p>To continue, answer: <b>${a} × ${b}</b></p>
    <input id="gate-ans" class="input" inputmode="numeric" autocomplete="off" aria-label="Answer" style="text-align:center;font-size:1.5rem">
    <p class="muted small-text" id="gate-msg"></p>
    <div class="row center"><button type="button" class="btn small plain" id="gate-no">Cancel</button><button class="btn small primary">Continue</button></div></form>`;
  document.body.appendChild(ov);
  const inp = $("#gate-ans", ov); inp.focus();
  $("#gate-no", ov).onclick = () => ov.remove();
  $("form", ov).onsubmit = e => { e.preventDefault(); if (+inp.value === a * b) { ov.remove(); onPass(); } else { $("#gate-msg", ov).textContent = "That's not right. Try again."; inp.value = ""; inp.focus(); } };
}

      <p class="muted">Copy this backup code and keep it somewhere safe (for example, email it to yourself). Paste it on another device to carry on.</p>
      <textarea class="input" id="exp" readonly aria-label="Backup code">${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
      <div class="row"><button class="btn small" id="copy">Copy backup code</button></div>
      <div class="field"><label for="imp">Restore from a backup code</label><textarea class="input" id="imp" placeholder="Paste a backup code here"></textarea></div>
      ${R.restore ? `<div class="confirm"><b>Replace all players on this device with the backup?</b><div class="row"><button class="btn small" data-cancel>Cancel</button><button class="btn small primary" id="doimp">Restore</button></div></div>` : '<div class="row"><button class="btn small" id="askimp">Restore</button></div>'}
    </section>`
};
AFTER.parent = () => {
  bindHeat();
  $$("[data-tab]").forEach(b => b.onclick = () => { R.tab = b.dataset.tab; R.confirm = null; R.restore = false; render(); });
  $$("[data-child]").forEach(b => b.onclick = () => { R.child = b.dataset.child; R.py = R.pw = null; render(); });
  $$("[data-wk]").forEach(b => b.onclick = () => { const p = S.profiles.find(x => x.id === R.child); p.week = Math.max(1, Math.min(36, p.week + +b.dataset.wk)); save(); render(); });
  $$("[data-pyear]").forEach(b => b.onclick = () => { const [id, y] = b.dataset.pyear.split(":"); const p = S.profiles.find(x => x.id === id); if (p.year !== +y) { p.year = +y; p.week = 1; } save(); render(); });
  $$("[data-pkb]").forEach(b => b.onclick = () => { const [id, k] = b.dataset.pkb.split(":"); S.profiles.find(x => x.id === id).kb = k; save(); render(); });
  $$("[data-ask]").forEach(b => b.onclick = () => { R.confirm = b.dataset.ask; render(); });
  $$("[data-cancel]").forEach(b => b.onclick = () => { R.confirm = null; R.restore = false; render(); });
  $$("[data-del]").forEach(b => b.onclick = () => { S.profiles = S.profiles.filter(p => p.id !== b.dataset.del); if (S.active === b.dataset.del) S.active = null; R.confirm = null; save(); toast("Player deleted"); render(); });
  const setS = (k, v) => { S.settings[k] = v; save(); render(); };
  $$("[data-font]").forEach(b => b.onclick = () => setS("font", b.dataset.font));
  $$("[data-size]").forEach(b => b.onclick = () => setS("size", +b.dataset.size));
  $$("[data-rate]").forEach(b => b.onclick = () => setS("rate", +b.dataset.rate));
  $$("[data-cap]").forEach(b => b.onclick = () => setS("capitals", b.dataset.cap));
  $$("[data-brk]").forEach(b => b.onclick = () => setS("breakMins", +b.dataset.brk));
  $$("[data-sw]").forEach(b => b.onclick = () => setS(b.dataset.sw, !S.settings[b.dataset.sw]));
  const v = $("#voice"); if (v) v.onchange = () => { S.settings.voice = v.value; save(); say("Hello! Let's practise our spellings."); };
  const py = $("#py"); if (py) py.onchange = () => { R.py = +py.value; R.pw = 1; render(); };
  const pw = $("#pw"); if (pw) pw.onchange = () => { R.pw = +pw.value; render(); };
  const pr = $("#doprint"); if (pr) pr.onclick = () => window.print();
  const ins = $("#install"); if (ins) ins.onclick = async () => { try { await window.__installPrompt.prompt(); } catch (e) { } window.__installPrompt = null; render(); };
  const cp = $("#copy"); if (cp) cp.onclick = () => { const t = $("#exp"); navigator.clipboard?.writeText(t.value).then(() => toast("Backup code copied"), () => { t.select(); toast("Selected. Copy it with your device's copy option."); }) ?? (t.select(), toast("Selected. Copy it with your device's copy option.")); };
  const ai = $("#askimp"); if (ai) ai.onclick = () => { if (!$("#imp").value.trim()) { toast("Paste a backup code first."); return; } R.impText = $("#imp").value.trim(); R.restore = true; render(); $("#imp").value = R.impText; };
  const di = $("#doimp"); if (di) di.onclick = () => {
    try { const s = JSON.parse(decodeURIComponent(escape(atob(R.impText)))); if (!Array.isArray(s.profiles)) throw 0; s.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) }; S = s; S.active = null; save(); toast("Backup restored"); go("profiles"); }
    catch (e) { R.restore = false; render(); toast("That backup code didn't work. Check it was copied in full."); }
  };
};

/* ---------- brain breaks ---------- */
let playStart = Date.now(), breakShown = false;
setInterval(() => {
  const m = S.settings.breakMins; if (!m || breakShown || !S.active) return;
  if (Date.now() - playStart >= m * 60000) {
    breakShown = true;
    const ov = document.createElement("div"); ov.className = "overlay";
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="bt">${petSVG(Math.max(1, petStage(totalStars(me()))), me().pet)}<h2 id="bt">Brain break!</h2><p>You've been spelling for ${m} minutes. Stand up, stretch, and have a drink of water.</p><button class="btn primary" id="back-from-break">I'm back</button></div>`;
    document.body.appendChild(ov); say("Brain break! Stand up, stretch, and have a drink of water.");
    $("#back-from-break").onclick = () => { ov.remove(); playStart = Date.now(); breakShown = false; };
  }
}, 15000);

/* ---------- boot ---------- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__installPrompt = e; });
S = load();
if (S.active && me()) R = { screen: "map" };
render();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
